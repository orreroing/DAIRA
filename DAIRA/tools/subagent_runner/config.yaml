# tools/subagent_runner/config.yaml
tools:
  run_subagent:
    signature: |
      run_subagent [<agent_id>] [<task_description>]
    docstring: >
      Experimental helper that launches a worker agent for a specified task.
      task_description MUST be a single, detailed sentence or paragraph describing the sub-task.
    arguments:
      - name: agent_id
        type: string
        description: "The unique identifier of the worker agent to be run."
        required: true
      - name: task_description
        type: string
        description: "A detailed description of the task for the worker agent to perform."
        required: true
