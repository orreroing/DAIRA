tools:
  run_node_trace:
    signature: |
      run_node_trace <script_path> <file_filter> <function_to_trace> <trace_depth>
    docstring: >
      **Description:**
      Runs a Node.js script under the built-in inspector CPU profiler and emits an
      LLM-friendly sampled call tree. Use this for JavaScript/TypeScript repositories
      when runtime execution paths are unclear.
      **Capabilities:**
      1. Executes a minimal Node.js reproduction script.
      2. Captures functions that appeared in the CPU profile.
      3. Filters frames by file path substring.
      4. Starts reporting around the target function when it appears in the sampled call tree.
      **Limitations:**
      * This is sampling-based, not exact function enter/return tracing.
      * Very fast functions may not appear unless the reproduction script runs enough work.
      * Return values are not captured by Node's CPU profiler.
      **Parameter Configuration:**
      1. **`script_path`**: Absolute path to a minimal JavaScript reproduction script.
      2. **`file_filter`**: Path substring for relevant frames, such as `src/parser` or `reproduce_issue.js`.
      3. **`function_to_trace`**: Function name where the sampled call tree should be centered.
      4. **`trace_depth`**: Maximum nested sampled call depth to display.
    arguments:
      - name: script_path
        type: string
        description: "Absolute path to the target JavaScript reproduction script."
        required: true
      - name: file_filter
        type: string
        description: "Path substring for filtering sampled call frames."
        required: true
      - name: function_to_trace
        type: string
        description: "Function name to locate in the sampled call tree."
        required: true
      - name: trace_depth
        type: integer
        description: "Maximum nested sampled call depth to display."
        required: true
