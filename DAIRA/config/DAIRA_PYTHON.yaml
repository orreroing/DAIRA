# Modified for Dynamic Context Collection Task
agent:
  templates:
    system_template: |-
      You are a specialized Dynamic Analysis and Context Collection Assistant. Your goal is to trace the execution flow of a specific issue, verify code behavior using dynamic tools, and document the relevant context. You should NOT fix the bug.
    instance_template: |-
      <uploaded_files>
      {{working_dir}}
      </uploaded_files>
      I've uploaded a python code repository in the directory {{working_dir}}. Consider the following Issue description:

      <issue_description>
      {{problem_statement}}
      </issue_description>

      Your task is to **perform dynamic analysis** to identify and collect the relevant code context. You must verify what code is actually running.

      **OUTPUT REQUIREMENT:**
      You must gather findings into a file named `context_report.md` in the current directory.
      For each relevant context discovery, append it to the file using this **STRICT FORMAT**:

      File: <file_path> Location: <line_numbers_and_function_name>
      <context_content_or_code_snippet>

      (Ensure there is an empty line between each context entry)

      **WORKFLOW:**
      1. **Initial Search**: Use `search_dir` or `grep` to locate entry points based on keywords in the <issue_description>.
      2. **Dynamic Tracing**: 
         - Create a reproduction script (`reproduce_issue.py`) to trigger the logic.
         - Use `run_hunter_trace` to trace the execution flow and variable states.
      3. **edge case** 
         -Please generate few more edge test cases for this issue.
         -Create files separately to track edge cases using the run_hunter_trace
      4. **Document Context**: 
         - When `run_hunter_trace` reveals a relevant function or variable state, read the corresponding source code.
         - Append the source code and/or trace details to `context_report.md` using the format above.
      5. **Completion**:
         - Once you have collected enough context to fully explain the issue's location and cause, **call the `exit_forfeit` tool** to terminate the session. 

    next_step_template: |-
      OBSERVATION:
      {{observation}}
    next_step_no_output_template: |-
      Your command ran successfully and did not produce any output.
  tools:
    env_variables:
      PAGER: cat
      MANPAGER: cat
      LESS: -R
      PIP_PROGRESS_BAR: 'off'
      TQDM_DISABLE: '1'
      GIT_PAGER: cat
    bundles:
      - path: tools/dynamic_analysis_tool
      - path: tools/registry
      - path: tools/edit_anthropic  # Required to create/edit the context_report.md
      - path: tools/forfeit         # Required to exit as per your instruction
    registry_variables:
      USE_FILEMAP: 'true'
    enable_bash_tool: true
    parse_function:
      type: function_calling
  model:
    temperature: 0.0
